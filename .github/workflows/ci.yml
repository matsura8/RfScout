name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      CI: "true"                      # turns on locked-mode restore (Directory.Build.props)
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (analyzers, warnings as errors)
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Unit tests
        run: dotnet test -c Release --no-build --results-directory out/test --report-xunit-trx --filter-not-trait Category=Hardware

      - name: Smoke test (--self-test)
        shell: pwsh
        run: |
          $p = Start-Process out/artifacts/bin/RfScout/release/RfScout.exe -ArgumentList '--self-test' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }

      - name: Vulnerable packages
        run: dotnet list package --vulnerable --include-transitive

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: out/test
          if-no-files-found: ignore
